schema-version = "1.19.0"

[install]
rustc.pkg-path = "rustc"
rustc.version = "^1.99.1"
rustc.outputs = "all"
cargo.pkg-path = "cargo"
cargo.version = "^1.99.1"
rustfmt.pkg-path = "rustfmt"
rustfmt.version = "^1.99.1"
clippy.pkg-path = "clippy"
clippy.version = "^1.99.1"
pkg-config.pkg-path = "pkg-config"
pkg-config.version = "^0.29.2"
pkg-config.outputs = "all"
openssl.pkg-path = "openssl"
openssl.version = "^3.5.9"
openssl.outputs = "all"
markdownlint-cli.pkg-path = "markdownlint-cli"
markdownlint-cli.version = "0.50.0"
infer.flake = "github:inference-gateway/cli/v0.261.0"
claude-code.pkg-path = "claude-code"
claude-code.version = "^2.1.321"
claude-code.pkg-group = "claude-code"
codex.pkg-path = "codex"
codex.version = "^0.167.1"
codex.pkg-group = "codex"

[profile]
common = '''
  export PATH="$HOME/.local/bin:$PATH"
'''

